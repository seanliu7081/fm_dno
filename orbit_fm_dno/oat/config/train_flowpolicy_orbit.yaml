# Flow-matching policy with an SO(2) orbit-aligned source-target coupling.
#
# Diff against train_flowpolicy.yaml is deliberately minimal: the policy _target_, the
# `coupling` / `action_spec` blocks, and the normalizer mode.  Everything else -- model
# size, optimizer, schedule, dataloader, EMA -- is identical, so a run of this config
# against a run of the baseline isolates the coupling.
#
# Sweep the `coupling` block to reproduce the experiment matrix in the design doc:
#
#   P0  baseline            use train_flowpolicy.yaml unchanged
#   P1  normalizer only     policy.coupling.mode=iid                      (this file)
#   P2  angle OT            policy.coupling.mode=perm  policy.coupling.cost=angle
#   P3  euclidean OT        policy.coupling.mode=perm  policy.coupling.cost=euclidean
#                                                      <- symmetry-blind control, NOT optional
#   P4  orbit rotation      policy.coupling.mode=rot   policy.coupling.align=heading
#   P6  full group OT       policy.coupling.mode=perm_rot policy.coupling.cost=group_ot
#   P7  kappa sweep         P4 plus policy.coupling.kappa=1|2|4|8
#
# P5 (P4 + matched inference prior) is not a training config: the same P4 checkpoint is
# evaluated with MatchedHeadingPrior at inference. See EXPERIMENT_PLAN.md, Phase 4.
#
# P3 is not optional.  Without a symmetry-blind OT coupling in the table, any gain from
# P2/P4/P6 is attributable to "some coupling helps", not to the symmetry in the coupling,
# and that is the first thing a reviewer will ask.

defaults:
  - _self_
  - task/policy: libero/libero10

name: train_flowpolicy_orbit
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

policy:
  _target_: oat.policy.flow_policy_orbit.OrbitFlowPolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  # ── SO(2) irrep layout of the 7-D delta-EEF action ──────────────────────────────
  # (dx,dy) and (wx,wy) are frequency-1; dz, wz and the gripper are invariant.
  # Verify against your controller config: this assumes world/base-frame deltas.
  action_spec:
    action_dim: 7
    vector_blocks: [[0, 1], [3, 4]]
    scalar_dims: [2, 5, 6]
    block_weights: null            # [1.0, 0.0] for a translation-only coupling

  # ── normalizer ──────────────────────────────────────────────────────────────────
  # Applied by OrbitFlowPolicy.set_normalizer, so TrainPolicyWorkspace stays untouched
  # and eval_policy_sim.py / from_checkpoint keep working unmodified.
  # Per-dim min-max does NOT commute with a rotation (measured rel. error 0.24), so
  # without this the coupling operates in a sheared space and every geometric claim
  # downstream is void.  Set to 'inherit' for the P0 control row.
  normalizer_mode: so2_block       # so2_block | inherit
  normalizer_vector_mode: rms      # rms | absmax

  # ── the coupling ────────────────────────────────────────────────────────────────
  coupling:
    mode: perm                     # iid | rot | perm | perm_rot
    cost: angle                    # group_ot | euclidean | angle
    align: heading                 # kabsch (transport-optimal) | heading (steerable)
    scalar_weight: 0.0
    kappa: .inf                    # von Mises dither on the applied rotation
    coupling_prob: 1.0
    min_heading_confidence: 0.0    # try 0.05 to skip near-stationary chunks
    assignment: hungarian          # circular_sort is scipy-free, angle cost only

  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [76, 76]
    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null

  embed_dim: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

  num_inference_steps: 10
  prior_noise_scale: 1.0

training:
  resume: True
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 5001
  val_every: 10
  sample_every: 10
  rollout_every: 100
  checkpoint_every: 10
  lr_scheduler: constant
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: True
  num_demo: 500
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  # NOTE: batch size is a coupling hyper-parameter here, not a free training detail.
  # A minibatch assignment approaches true OT as B grows, and its conditional bias
  # grows with it too (a source can be handed to a target from a different observation).
  # Report it, and hold it fixed across the comparison.
  batch_size: 32
  num_workers: 2
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 32
  num_workers: 2
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

logging:
  project: oat_dev
  resume: True
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ["${name}", "${task_name}", "${policy.coupling.mode}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: mean_success_rate
    mode: max
    k: 3
    format_str: "ep-{epoch:04d}_sr-{mean_success_rate:.3f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
