[program:fm-starvla-heading-throughput]
directory=/workspace/fm_dno
environment=PROC_NAME="%(program_name)s",STARVLA_PROFILE_MICRO_BATCH="10"
command=/workspace/fm_dno/scripts/supervisor/fm-starvla-heading-throughput.sh
autostart=false
autorestart=false
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=360
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
