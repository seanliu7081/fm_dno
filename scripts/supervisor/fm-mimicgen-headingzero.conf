[program:fm-mimicgen-headingzero]
directory=/workspace/fm_dno
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/fm-mimicgen-headingzero.sh
autostart=true
autorestart=false
startsecs=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
