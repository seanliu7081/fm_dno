# Offline observation -> action-chunk heading supervision. No environment or W&B needed.
defaults:
  - _self_
  - task/policy: libero/libero10

name: train_heading_reference
seed: 42
# Keep the episode split fixed when varying the optimization seed.
split_seed: 42
reference_mode: image_state # image_state | state (RGB is not loaded in state mode)
horizon: 16
n_action_steps: 8
n_obs_steps: 2
shape_meta: ${task.policy.shape_meta}

action_spec:
  action_dim: 7
  vector_blocks: [[0, 1], [3, 4]]
  scalar_dims: [2, 5, 6]
  block_weights: [1.0, 0.0]
normalizer_vector_mode: rms

reference:
  _target_: oat.perception.heading_predictor.ObservationHeadingPredictor
  n_obs_steps: ${n_obs_steps}
  hidden_dim: 128
  min_target_confidence: 0.05
  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [76, 76]
      eval_fixed_crop: true
    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null

training:
  device: auto
  num_epochs: 30
  num_demo: 500
  max_grad_norm: 1.0
  max_train_batches: null
  max_val_batches: null

optimizer:
  head_lr: 0.001
  encoder_lr: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

dataloader:
  batch_size: 32
  num_workers: 2
  pin_memory: true
  persistent_workers: true

evaluation:
  confidence_threshold: 0.5
  motion_key: robot0_eef_pos
  min_motion: 0.0001

hydra:
  job:
    chdir: false
  run:
    dir: output/heading_reference/${reference_mode}/seed${seed}/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: output/heading_reference/${now:%Y%m%d_%H%M%S}
    subdir: ${reference_mode}/seed${seed}
