# Arm R -- reflow.  PLAN_fewstep_coupling.md, section 3.
#
# The diff against train_flowpolicy_orbit.yaml is deliberately small, and every item in it
# is load-bearing:
#
#   policy._target_            ReflowFlowPolicy  -- x0 comes from the batch, not randn_like
#   policy.init_ckpt           REQUIRED. The donor whose transport plan is being distilled;
#                              also the weights this run starts from (standard for reflow,
#                              and what makes a ~300-epoch cap plausible)
#   policy.coupling.mode       iid, asserted in the policy: the source IS the stored z, so a
#                              data-side coupling has nothing left to act on
#   task.policy.dataset        ReflowPairDataset + pairs_path
#   policy.num_inference_steps 2 -- rollout selection happens AT THE ENDPOINT. Reflow's
#                              value at N=10 is not the point of this arm; top-k must be
#                              chosen on the metric the deliverable is stated in
#   training.num_epochs        301, rollout_every 25
#
# Everything else -- architecture, optimizer, EMA, dataloader, normalizer_mode, action_spec
# -- is identical to the orbit config, so a reflow-vs-baseline difference is the coupling
# and nothing else.
#
# NOTE ON `defaults`: `_self_` is LAST here (the orbit config has it first) so that the
# `task:` block below overrides the task group's dataset instead of being overwritten by it.
# Only `_target_` and `pairs_path` are restated; zarr_path / obs_keys / seed / val_ratio are
# inherited from task/policy/libero/libero10.yaml, which is exactly what Gate R2 requires.
#
# Launch:
#   1) generate the pairs
#      MUJOCO_GL=egl python scripts/generate_reflow_pairs.py \
#          -c output/exp/P1_curve/seed42/checkpoints/ep-0350_sr-0.400.ckpt \
#          -o output/reflow_pairs/P1_curve_ep0350_N10_z0
#   2) train
#      CUDA_VISIBLE_DEVICES=0 MUJOCO_GL=egl python scripts/run_workspace.py \
#          --config-name=train_flowpolicy_reflow \
#          policy.init_ckpt=output/exp/P1_curve/seed42/checkpoints/ep-0350_sr-0.400.ckpt \
#          task.policy.dataset.pairs_path=output/reflow_pairs/P1_curve_ep0350_N10_z0 \
#          seed=42 training.seed=42 training.num_demo=500 \
#          task.policy.lazy_eval=false \
#          task.policy.env_runner.n_test=50 task.policy.env_runner.n_parallel_envs=5 \
#          task.policy.env_runner.n_test_vis=0 checkpoint.topk.k=5 \
#          hydra.run.dir=output/exp/R1_reflow/seed42
#
# The R4 retry (a second pair-per-window set, new z_seed) is a list, no regeneration of the
# first: task.policy.dataset.pairs_path='[<dir_z0>,<dir_z1>]'

defaults:
  - task/policy: libero/libero10
  - _self_

name: train_flowpolicy_reflow
_target_: oat.workspace.train_policy.TrainPolicyWorkspace

seed: 42
horizon: 16
n_action_steps: 8
n_obs_steps: 2
task_name: ${task.policy.name}
shape_meta: ${task.policy.shape_meta}

task:
  policy:
    dataset:
      _target_: oat.dataset.reflow_pairs.ReflowPairDataset
      # directory written by scripts/generate_reflow_pairs.py (holds train.npz / val.npz),
      # or a list of them for multiple pair sets over the same windows.
      pairs_path: ???

policy:
  _target_: oat.policy.flow_policy_reflow.ReflowFlowPolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  # ── reflow ──────────────────────────────────────────────────────────────────────
  # The donor. BasePolicy.from_checkpoint returns the EMA policy, i.e. the same weights
  # that scored the reported success rate and the same ones generate_reflow_pairs.py
  # integrated to make the targets. Distilling one model and initialising from another
  # would be a different (and unmotivated) experiment.
  init_ckpt: ???
  # Gate R1 only: lets the policy compare the workspace-rebuilt normalizer against the
  # one the pairs were generated under. Interpolated so it can never disagree with the
  # dataset's copy.
  pairs_path: ${task.policy.dataset.pairs_path}
  reflow_key: reflow_z
  strict_init: true

  # ── unchanged from the orbit config ─────────────────────────────────────────────
  action_spec:
    action_dim: 7
    vector_blocks: [[0, 1], [3, 4]]
    scalar_dims: [2, 5, 6]
    block_weights: [1.0, 0.0]      # G4' decision, held fixed across every arm

  normalizer_mode: so2_block       # kept on every arm: cost-free, and it makes the
  normalizer_vector_mode: rms      # geometry clean for the diagnostics table

  coupling:
    mode: iid                      # asserted by ReflowFlowPolicy
    cost: angle
    align: heading
    scalar_weight: 1.0
    kappa: .inf
    coupling_prob: 1.0
    min_heading_confidence: 0.0
    assignment: hungarian

  obs_encoder:
    _target_: oat.perception.fused_obs_encoder.FusedObservationEncoder
    _recursive_: false
    shape_meta: ${shape_meta}
    vision_encoder:
      _target_: oat.perception.robomimic_vision_encoder.RobomimicRgbEncoder
      crop_shape: [76, 76]
    state_encoder:
      _target_: oat.perception.state_encoder.ProjectionStateEncoder
      out_dim: null

  embed_dim: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1

  # THE ENDPOINT. In-training top-k selection runs the rollout at this many steps, so the
  # checkpoint that gets selected is the one that is best at the budget the deliverable is
  # measured at. The N-sweep at eval time overrides it anyway (--num-inference-steps).
  num_inference_steps: 2
  prior_noise_scale: 1.0

training:
  resume: True
  allow_bf16: True
  max_grad_norm: 1.0
  num_epochs: 301
  val_every: 10
  sample_every: 10
  rollout_every: 25
  checkpoint_every: 10
  lr_scheduler: constant
  lr_warmup_steps: 100
  gradient_accumulate_every: 1
  max_train_steps: null
  max_val_steps: null
  max_reconst_steps: null
  seed: ${seed}
  use_ema: True
  num_demo: 500
  tqdm_interval_sec: 1.0

ema:
  _target_: oat.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

optimizer:
  policy_lr: 5.0e-5
  obs_enc_lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]

dataloader:
  batch_size: 32
  num_workers: 2
  shuffle: True
  pin_memory: True
  persistent_workers: True
  drop_last: True

val_dataloader:
  batch_size: 32
  num_workers: 2
  shuffle: False
  pin_memory: True
  persistent_workers: True
  drop_last: True

logging:
  project: oat_dev
  resume: True
  mode: online
  name: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}
  tags: ["${name}", "${task_name}", "reflow"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: mean_success_rate
    mode: max
    k: 5
    format_str: "ep-{epoch:04d}_sr-{mean_success_rate:.3f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  wandb_name_base: ${now:%Y%m%d.%H%M%S}_${name}_${task_name}_N${training.num_demo}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
  sweep:
    dir: output/${now:%Y%m%d}/${now:%H%M%S}_${name}_${task_name}_N${training.num_demo}
    subdir: ${hydra.job.num}
